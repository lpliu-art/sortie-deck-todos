name: Feature request
description: Propose an enhancement for Sortie Deck
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior or UX
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Primary module
      options:
        - auth
        - web
        - cli
        - orchestrator
        - pipeline
        - graph
        - rooms
        - executors
        - toolkit
        - agents
        - knowledge
        - memory
        - artifacts
        - other / cross-cutting
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
